{% if not user.profile.interests_set %}<aside class="interest-invitation"><span class="interest-spark" aria-hidden="true">✳</span><div><strong>What’s your kind of content?</strong><p>Choose your interests. Make this feel more like you.</p></div><a class="button yellow" href="{% url 'interests' %}">Build my mix ↗</a></aside>{% elif interest_labels %}<div class="your-mix-strip"><span>Your mix</span>{% for label in interest_labels|slice:':3' %}<b>{{ label }}</b>{% endfor %}<a href="{% url 'interests' %}">Edit interests ↗</a></div>{% endif %}
