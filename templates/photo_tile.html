<a class="photo-tile {% if not post.image %}tile-text{% endif %}" href="{% url 'detail' post.pk %}" aria-label="View post by {{ post.author.profile.name }}">{% if post.image %}<img src="{{ post.image.url }}" alt="{{ post.text|truncatechars:90 }}" loading="lazy">{% else %}<span class="tile-thought">{{ post.text|truncatechars:150 }}</span>{% endif %}<span class="tile-overlay"><strong>{{ post.author.profile.name }}</strong><span>♡ {{ post.likes.count }} &nbsp; ◌ {{ post.comments.count }}</span></span></a>
